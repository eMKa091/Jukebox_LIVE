# Continuous replication of the SQLite database to object storage.
#
# The image installs this file as /etc/litestream.yml, which is where both
# `litestream restore` and `litestream replicate` look when they are given
# nothing else. Litestream fills in the ${...} from the environment; it has no
# variable of its own for "where the replica is", so the bucket is named here.
#
# An S3-compatible bucket outside AWS (Cloudflare R2 is the one this was
# written for) needs its endpoint spelled out, scheme included:
#     LITESTREAM_ENDPOINT=https://<account id>.r2.cloudflarestorage.com
# The two keys are read by Litestream itself from
#     LITESTREAM_ACCESS_KEY_ID  and  LITESTREAM_SECRET_ACCESS_KEY
dbs:
  - path: ${JUKEBOX_DB}
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: jukebox
        endpoint: ${LITESTREAM_ENDPOINT}
        region: auto
        # How far behind the replica may fall. This is the worst case for how
        # many seconds of votes a total machine loss could cost.
        sync-interval: 1s
        # Three days of restore points, so "restore to just before we deleted
        # that event" is possible.
        retention: 72h
        snapshot-interval: 6h
