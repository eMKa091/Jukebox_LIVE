[project]
name = "jukebox-live"
version = "1.0.0"
description = "Live song voting for a band and its audience"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette's own test client emits these; they are not ours to fix.
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
