{% extends "base.html" %}
{% block title %}Sign in — Jukebox LIVE{% endblock %}
{% block content %}
<h1>Sign in</h1>
<form method="post" action="/admin/login" class="card" style="max-width:380px">
  <label class="field">
    <span>Username</span>
    <input type="text" name="username" autocomplete="username" required autofocus>
  </label>
  <label class="field">
    <span>Password</span>
    <input type="password" name="password" autocomplete="current-password" required>
  </label>
  <button class="btn wide" type="submit">Sign in</button>
</form>
{% endblock %}
