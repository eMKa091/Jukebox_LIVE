# The Cloudflare Worker's packages (docs/08-cloudflare-port.md, step 5.2).
# pywrangler reads them from here and vendors Pyodide builds of them into
# python_modules/. The same pins as ../requirements.txt, minus the server:
# on Cloudflare the runtime is the server.
[project]
name = "jukebox-live-worker"
version = "1.0.0"
description = "Jukebox LIVE as a Cloudflare Worker with a Durable Object"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "argon2-cffi==25.1.0",
    "itsdangerous==2.2.0",
    "qrcode==8.2",
    "tzdata>=2025.2",
]
