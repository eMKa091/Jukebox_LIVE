# Fly.io deployment. The steps, in order and with what each one is for, are in
# README.md under "Deploying".
#
# `app` must be a name nobody else on Fly has taken. If `fly apps create`
# refuses this one, pick another and put it here.

app = "jukebox-live"
primary_region = "waw"        # Warsaw: ~250 km from Ostrava

[build]

[env]
  JUKEBOX_DB = "/data/jukebox.db"
  # What the audience types and what the QR codes say. Set it once the name
  # points here (README.md, "Deploying", step 6).
  # JUKEBOX_PUBLIC_URL = "https://hlasuj.jukeboxheroes.cz"

[mounts]
  source = "jukebox_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true

  # Do NOT scale to zero. A cold start is fine on a Tuesday and unacceptable
  # when the singer has just told two hundred people to open the link. The
  # saving is about $2/month.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # SSE connections are long-lived by design; they are not stalled requests.
  # Every phone in the room holds one, and when a round changes each opens a
  # second for a moment while the first is closing. Sized for a room of 500
  # with that doubling and room to spare.
  [http_service.concurrency]
    type = "connections"
    hard_limit = 2000
    soft_limit = 1500

[[http_service.checks]]
  interval = "20s"
  timeout = "4s"
  grace_period = "10s"
  method = "GET"
  path = "/readyz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
